name: Scrape Prices

on:
  schedule:
    - cron: "0 */6 * * *"   # هر ۶ ساعت اجرا می‌شود (UTC)
  workflow_dispatch:         # دکمه اجرای دستی برای تست

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # اجازه نوشتن برای کامیت کردن prices.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push prices.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices.json
          git commit -m "Update prices" || exit 0
          git push
